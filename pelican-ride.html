<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf1e8">
  <title>鹈鹕的海岸骑行 · Pelican Pedal Club</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #234b46;
      --muted: #6c8275;
      --paper: #fbfaf3;
      --line: #dce2d5;
      --accent: #cf7253;
      --sky-top: #e6eee1;
      --sky-bottom: #f5f1d9;
      --sun: #edb66c;
      --sea: #a6c9bc;
      --sea-light: #c2d9c9;
      --hill: #b7cbbb;
      --hill-back: #cedbc6;
      --sand: #e5dfbf;
      --road: #f1ebd6;
      --grass: #729782;
      --cloud: #fffdf2;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-width: 320px;
      background: #edf1e8;
      color: var(--ink);
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button { font: inherit; }
    button:focus-visible, a:focus-visible {
      outline: 3px solid var(--accent);
      outline-offset: 5px;
    }
    button { -webkit-tap-highlight-color: transparent; }
    .shell { width: min(1440px, calc(100% - 88px)); margin: 0 auto; }
    .masthead {
      min-height: 103px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }
    .brand { display: flex; align-items: center; gap: 13px; }
    .brand-mark { width: 43px; height: 43px; }
    .brand-name { font-size: 13px; font-weight: 750; letter-spacing: 2px; line-height: 1.5; }
    .brand-name span { display: block; font-size: 10px; font-weight: 450; letter-spacing: 3.1px; }
    .edition { display: flex; align-items: center; gap: 13px; font-size: 11px; letter-spacing: 2px; }
    .edition i { display: block; width: 6px; height: 6px; background: var(--accent); border-radius: 50%; }
    .postcard {
      position: relative;
      overflow: hidden;
      isolation: isolate;
      background: var(--sky-top);
      border: 1px solid #d8dfcf;
      border-radius: 24px;
      box-shadow: 0 14px 50px -35px #47634a66;
    }
    .scene { display: block; width: 100%; height: auto; }
    .scene .sky-top { stop-color: var(--sky-top); }
    .scene .sky-bottom { stop-color: var(--sky-bottom); }
    .scene .sun { fill: var(--sun); }
    .scene .cloud { fill: var(--cloud); }
    .scene .sea { fill: var(--sea); }
    .scene .sea-light { fill: var(--sea-light); }
    .scene .hill { fill: var(--hill); }
    .scene .hill-back { fill: var(--hill-back); }
    .scene .sand { fill: var(--sand); }
    .scene .road { fill: var(--road); }
    .scene .grass { stroke: var(--grass); }
    .intro { position: absolute; left: 5.3%; top: 9%; pointer-events: none; }
    .eyebrow { margin: 0 0 20px; font-size: clamp(9px, .85vw, 12px); font-weight: 600; letter-spacing: 3px; }
    h1 { margin: 0; font-family: "Songti SC", "STSong", "SimSun", serif; font-size: clamp(34px, 4.4vw, 67px); font-weight: 500; letter-spacing: -2px; line-height: 1.24; }
    .intro-description { margin: 20px 0 0; font-size: clamp(10px, 1.05vw, 14px); line-height: 1.8; letter-spacing: 2px; color: #637e70; }
    .scene-note { position: absolute; left: 5.3%; bottom: 5.3%; display: flex; align-items: center; gap: 10px; font-size: 10px; letter-spacing: 2px; color: #6f816b; }
    .scene-note::before { content: ""; width: 26px; height: 1px; background: currentColor; }
    .stamp { position: absolute; right: 4.8%; top: 5.7%; width: 65px; height: 65px; color: #7d927b; transform: rotate(12deg); opacity: .8; }
    .controls {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      padding: 26px 4px;
    }
    .now-playing { display: flex; align-items: center; gap: 13px; min-width: 190px; }
    .activity { display: flex; gap: 3px; align-items: center; height: 22px; }
    .activity span { width: 3px; height: 12px; border-radius: 4px; background: #7d9d80; animation: equalize 1s ease-in-out infinite alternate; }
    .activity span:nth-child(2) { height: 21px; animation-delay: -.7s; }
    .activity span:nth-child(3) { height: 15px; animation-delay: -.3s; }
    .paused .activity span { animation-play-state: paused; }
    @keyframes equalize { to { transform: scaleY(.35); } }
    .track-name { font-size: 13px; letter-spacing: 1px; }
    .track-caption { margin-top: 6px; color: var(--muted); font-size: 10px; letter-spacing: 1.2px; }
    .playback { display: flex; align-items: center; gap: 19px; }
    .round-button {
      display: grid; place-items: center;
      flex: 0 0 auto;
      width: 46px; height: 46px;
      border: 1px solid #cfd9ca; border-radius: 50%;
      cursor: pointer; color: var(--ink); background: transparent;
      transition: background .18s, transform .18s;
    }
    .round-button:hover { background: #dfe7da; transform: translateY(-2px); }
    .round-button:active { transform: scale(.93); }
    .round-button svg { width: 19px; height: 19px; }
    .play-button { background: var(--ink); color: var(--paper); border-color: var(--ink); width: 50px; height: 50px; }
    .play-button:hover { background: #366357; }
    .icon-play { display: none; }
    .paused .icon-play { display: block; }
    .paused .icon-pause { display: none; }
    .speed-control { display: flex; align-items: center; padding: 4px; border: 1px solid #d6dece; border-radius: 40px; gap: 2px; }
    .speed-control button { background: transparent; border: 0; padding: 9px 15px; border-radius: 30px; color: #71816d; font-size: 11px; cursor: pointer; transition: background .18s, color .18s; white-space: nowrap; }
    .speed-control button[aria-pressed="true"] { background: #fffef7; color: var(--ink); box-shadow: 0 2px 7px #30543e0b; }
    .extras { display: flex; align-items: center; gap: 11px; min-width: 190px; justify-content: flex-end; }
    .divider { width: 1px; height: 24px; background: #d1dbcb; margin: 0 3px; }
    .footer { display: flex; justify-content: space-between; gap: 20px; align-items: center; padding: 12px 4px 27px; font-size: 10px; color: #82907c; letter-spacing: 1.4px; }
    .footer span:last-child { font-size: 9px; letter-spacing: 2px; }
    .toast { position: absolute; bottom: 12%; left: 57%; transform: translate(-50%, 8px); border: 1px solid #e5dfce; border-radius: 30px; background: #fffdf2ee; color: var(--ink); font-size: 12px; padding: 10px 18px; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; white-space: nowrap; }
    .toast.visible { opacity: 1; transform: translate(-50%, 0); }
    .dusk {
      --sky-top: #dededc;
      --sky-bottom: #f5d9b9;
      --sun: #e9a179;
      --sea: #a4bdbc;
      --sea-light: #c1ceca;
      --hill: #aebeb8;
      --hill-back: #c7cebf;
      --sand: #ddd2b5;
      --road: #eae0c9;
      --grass: #7b8e7b;
      --cloud: #fff0de;
    }
    .dusk .sun-halo { opacity: .28; }
    .sun-halo { opacity: .12; }
    .scene .sun, .scene .sea, .scene .sea-light, .scene .hill, .scene .hill-back, .scene .sand, .scene .road, .scene .cloud { transition: fill 1.2s; }
    .scene .sky-top, .scene .sky-bottom { transition: stop-color 1.2s; }
    @media (min-width: 1600px) { .shell { width: min(1440px, calc(100% - 128px)); } .masthead { min-height: 116px; } }
    @media (max-width: 900px) {
      .shell { width: calc(100% - 40px); }
      .masthead { min-height: 85px; }
      .controls { gap: 14px; padding: 22px 0; }
      .now-playing { min-width: auto; }
      .extras { min-width: auto; }
      .playback { gap: 12px; }
      .track-name { font-size: 11px; }
      .track-caption { font-size: 9px; }
      .speed-control button { padding: 9px 12px; }
      .intro { top: 8%; }
      .eyebrow { margin-bottom: 12px; letter-spacing: 2px; }
      .intro-description { margin-top: 12px; letter-spacing: 1px; }
      .stamp { width: 49px; height: 49px; }
    }
    @media (max-width: 620px) {
      .shell { width: calc(100% - 28px); }
      .masthead { min-height: 78px; }
      .brand { gap: 9px; }
      .brand-mark { width: 34px; height: 34px; }
      .brand-name { font-size: 11px; letter-spacing: 1.4px; }
      .brand-name span { font-size: 8px; letter-spacing: 2.5px; }
      .edition { font-size: 9px; letter-spacing: 1px; gap: 7px; }
      .edition .edition-prefix { display: none; }
      .postcard { border-radius: 19px; height: clamp(475px, 126vw, 660px); }
      .scene { position: absolute; width: 172%; max-width: none; left: -51%; bottom: 0; height: auto; }
      .intro { top: 7%; left: 7%; }
      h1 { font-size: clamp(36px, 8.2vw, 49px); letter-spacing: -1px; }
      .eyebrow { font-size: 8px; margin-bottom: 13px; }
      .intro-description { font-size: 10px; margin-top: 11px; letter-spacing: 1px; }
      .stamp { width: 46px; height: 46px; right: 7%; top: 7%; }
      .scene-note { left: 7%; bottom: 4.4%; font-size: 8px; letter-spacing: 1px; }
      .controls { display: grid; grid-template-columns: 1fr auto; gap: 20px 12px; padding: 21px 1px; }
      .now-playing { grid-column: 1; grid-row: 2; }
      .playback { grid-column: 1 / -1; grid-row: 1; justify-content: center; }
      .extras { grid-column: 2; grid-row: 2; }
      .extras .round-button { width: 38px; height: 38px; }
      .extras .round-button svg { width: 17px; height: 17px; }
      .speed-control { padding: 4px 6px; }
      .speed-control button { padding: 10px 24px; font-size: 12px; }
      .playback { gap: 20px; }
      .footer { padding-top: 5px; font-size: 9px; letter-spacing: .4px; }
      .footer span:last-child { font-size: 8px; letter-spacing: .9px; }
      .toast { left: 56%; bottom: 10%; font-size: 10px; }
    }
    @media (max-width: 360px) { .speed-control button { padding: 10px 18px; } .edition { font-size: 8px; } }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <header class="masthead">
      <div class="brand" aria-label="Pelican Pedal Club，鹈鹕骑行俱乐部">

          <circle cx="24" cy="24" r="22" stroke="currentColor" stroke-width="1.2"/>

        <div class="brand-name">PELICAN<span>PEDAL CLUB</span></div>

          <path d="M575 390q2-8 15-6l55 5q10 1 7 9-3 6-19 5l-47-3q-14-1-11-10Z" fill="#2d5048"/>
          <path d="m587 389 53 5" fill="none" stroke="#718878" stroke-width="2" stroke-linecap="round"/>
          <g fill="none" stroke="#758775" stroke-width="2.2">
            <path d="M509 539 661 520a23 23 0 0 1 5 46l-156-9a9 9 0 0 1-1-18Z"/>
            <path d="M515 543 661 525M515 553l146 9" stroke="#e5dfc3" stroke-width="1"/>

            <!-- Black flight feathers peep out below the folded near wing. -->
            <path d="M533 333c27 2 60 14 96 21-12 16-37 23-60 13-15-7-30-19-36-34Z" fill="#33544e"/>
            <path d="M544 345q25 17 48 20M561 343q25 16 46 19" fill="none" stroke="#82958a" stroke-width="2" stroke-linecap="round"/>
            <path d="M540 317c24-14 55-12 78 0 28 13 43 27 62 34 30 11 70 17 104 8l17-7q7-3 10 2 3 4-3 8l-13 8q-14 7-35 7c-44 0-81-4-113-15-34-11-78-13-102-26-10-5-13-13-5-19Z" fill="#f4f3e4" stroke="#536d59" stroke-width="2.4" stroke-linejoin="round"/>

      <div class="intro">
        <p class="eyebrow">A LITTLE RIDE, A LOT OF JOY</p>
        <h1>跟着风，<br>慢慢骑。</h1>
        <p class="intro-description">不赶路，只感受路。<br>和鹈鹕一起，绕个远。</p>
      </div>
      <svg class="stamp" viewBox="0 0 80 80" fill="none" aria-hidden="true">
        <circle cx="40" cy="40" r="36" stroke="currentColor" stroke-width="1"/>
        <circle cx="40" cy="40" r="31" stroke="currentColor" stroke-width=".6" stroke-dasharray="2 3"/>

    <section class="controls" aria-label="动画控制">
      <div class="now-playing">
        <div class="activity" aria-hidden="true"><span></span><span></span><span></span></div>
        <div><div class="track-name" id="ride-status">正在收集沿途的风</div><div class="track-caption">今日安排：漫无目的</div></div>
      </div>
      <div class="playback">
        <button class="round-button play-button" id="play-toggle" type="button" aria-label="暂停动画" title="暂停 / 继续（空格键）">
          <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 4.8c0-.6.7-1 1.2-.7l12 7.2a.8.8 0 0 1 0 1.4l-12 7.2c-.5.3-1.2-.1-1.2-.7Z" transform="translate(-2 0)"/></svg>
        </button>
        <div class="speed-control" role="group" aria-label="骑行速度">
          <button type="button" data-speed="0.65" aria-pressed="false">悠闲</button>
          <button type="button" data-speed="1" aria-pressed="true">兜风</button>
          <button type="button" data-speed="1.65" aria-pressed="false">飞驰</button>
        </div>
      </div>
      <div class="extras">
        <button class="round-button" id="bell-button" type="button" aria-label="响一下车铃" title="叮铃！">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16c2-2 1-5 2-8a5.2 5.2 0 0 1 10 0c1 3 0 6 2 8H5Zm5 4h4M12 3V2M3 8 2 6M21 8l1-2"/></svg>
        </button>
        <span class="divider" aria-hidden="true"></span>
        <button class="round-button" id="light-toggle" type="button" aria-label="切换到日落配色" aria-pressed="false" title="换一种天色">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
      </div>
    </section>
    <footer class="footer"><span>把时间，花在喜欢的路上。</span><span>MADE OF SVG & A LITTLE DAYDREAM</span></footer>
  </main>

  <script>
    (() => {
      'use strict';

      const byId = id => document.getElementById(id);
      const motionPreference = window.matchMedia('(prefers-reduced-motion: reduce)');
      const nodes = Object.fromEntries([
        'rear-wheel', 'front-wheel', 'rider-body', 'pelican-eye', 'scarf-tail',
        'flowers', 'road-marks', 'verge', 'waves', 'clouds', 'sailboat',
        'distant-birds', 'bird-one', 'bird-two', 'wind-strokes', 'bike-shadow',
        'leg-far', 'leg-far-outline', 'leg-near', 'leg-near-outline',
        'foot-far', 'foot-near', 'far-pedal', 'front-pedal', 'bell-rings'
      ].map(id => [id, byId(id)]));

      let playing = !motionPreference.matches;
      let targetSpeed = 1;
      let speed = 1;
      let time = 0;
      let distance = 0;
      let previousTime = null;
      let frame = null;
      let toastTimer;
      let ringTimer;
      let audioContext;
      const crank = { x: 664, y: 543, radius: 37 };
      const TAU = Math.PI * 2;

      function transform(id, value) { nodes[id].setAttribute('transform', value); }

      // A two-bone inverse-kinematics solution keeps each webbed foot on its pedal.
      function drawLeg(side, phase, bob) {
        const near = side === 'near';
        const hipX = near ? 622 : 604;
        const hipY = 380 + bob;
        const pedalX = crank.x + Math.cos(phase) * crank.radius;
        const pedalY = crank.y + Math.sin(phase) * crank.radius;
        const ankleX = pedalX - 7;
        const ankleY = pedalY - 7;
        const dx = ankleX - hipX;
        const dy = ankleY - hipY;
        const reach = Math.max(.001, Math.hypot(dx, dy));
        const thigh = 106;
        const shin = 113;
        const along = (thigh * thigh - shin * shin + reach * reach) / (2 * reach);
        const bend = Math.sqrt(Math.max(0, thigh * thigh - along * along));
        const kneeX = hipX + along * dx / reach + bend * dy / reach;
        const kneeY = hipY + along * dy / reach - bend * dx / reach;
        const path = `M${hipX} ${hipY} L${kneeX.toFixed(2)} ${kneeY.toFixed(2)} L${ankleX.toFixed(2)} ${ankleY.toFixed(2)}`;
        nodes[`leg-${side}`].setAttribute('d', path);
        nodes[`leg-${side}-outline`].setAttribute('d', path);
        transform(`foot-${side}`, `translate(${ankleX.toFixed(2)} ${(pedalY - 4).toFixed(2)}) rotate(${(Math.cos(phase) * 5).toFixed(2)})`);
        const pedal = nodes[near ? 'front-pedal' : 'far-pedal'];
        pedal.children[0].setAttribute('d', `M${crank.x} ${crank.y} L${pedalX.toFixed(2)} ${pedalY.toFixed(2)}`);
        pedal.children[1].setAttribute('x', pedalX - 16);
        pedal.children[1].setAttribute('y', pedalY - 1);
      }

      function render() {
        // The same travel distance drives the road, wheel rotation and chain gearing.
        const wheelAngle = distance / 103;
        const phase = (wheelAngle / 1.15 + Math.PI / 4) % TAU;
        const bob = Math.sin(phase * 2) * 2.2;
        const degrees = (wheelAngle * 180 / Math.PI) % 360;
        transform('rear-wheel', `rotate(${degrees})`);
        transform('front-wheel', `rotate(${degrees})`);
        transform('rider-body', `translate(0 ${bob})`);
        drawLeg('far', phase + Math.PI, bob);
        drawLeg('near', phase, bob);
        transform('road-marks', `translate(${-distance % 1280} 0)`);
        transform('verge', `translate(${-(distance * .78) % 1280} 0)`);
        transform('waves', `translate(${-(distance * .13) % 1280} 0)`);
        transform('clouds', `translate(${-(distance * .035) % 1280} 0)`);
        transform('flowers', `rotate(${Math.sin(time * 3.4) * 2.5} 866 415)`);
        transform('scarf-tail', `rotate(${Math.sin(time * 5.1) * 3.6} 668 280)`);
        transform('sailboat', `translate(${291 - Math.sin(time * .055) * 65} ${418 + Math.sin(time * 1.3) * 1.4}) rotate(${Math.sin(time * .9) * 1.4})`);
        transform('distant-birds', `translate(${Math.sin(time * .16) * 14} ${Math.sin(time * .8) * 4})`);
        const flap = Math.sin(time * 2.4) * 3;
        nodes['bird-one'].setAttribute('d', `M432 211q9 ${-10 + flap} 18 0 9 ${-10 + flap} 18 0`);
        nodes['bird-two'].setAttribute('d', `M473 190q6 ${-7 - flap * .5} 12 0 6 ${-7 - flap * .5} 12 0`);
        transform('wind-strokes', `translate(${Math.sin(time * 2) * 9} 0)`);
        nodes['wind-strokes'].setAttribute('opacity', .3 + (Math.sin(time * 2) + 1) * .18);
        nodes['bike-shadow'].setAttribute('rx', 259 + bob * .8);
        // One quick blink every few seconds, with the pupil and highlight together.
        const blinkTime = time % 5.7;
        const eyeOpen = blinkTime > 5.48 ? Math.max(.08, Math.abs(blinkTime - 5.59) / .11) : 1;
        transform('pelican-eye', `translate(719 207) scale(1 ${eyeOpen})`);
      }

      function tick(timestamp) {
        frame = null;
        if (!playing || document.hidden) { previousTime = null; return; }
        const delta = previousTime === null ? 0 : Math.min((timestamp - previousTime) / 1000, .05);
        previousTime = timestamp;
        speed += (targetSpeed - speed) * (1 - Math.exp(-delta * 4));
        time += delta * speed;
        distance += delta * speed * 240;
        render();
        frame = requestAnimationFrame(tick);
      }

      function schedule() {
        if (playing && !document.hidden && frame === null) {
          previousTime = null;
          frame = requestAnimationFrame(tick);
        }
      }

      function updatePlayback() {
        document.body.classList.toggle('paused', !playing);
        byId('play-toggle').setAttribute('aria-label', playing ? '暂停动画' : '继续动画');
        byId('ride-status').textContent = playing ? '正在收集沿途的风' : '停一停，也是一种风景';
        if (!playing && frame !== null) {
          cancelAnimationFrame(frame);
          frame = null;
          previousTime = null;
        }
        schedule();
      }

      function togglePlayback() { playing = !playing; updatePlayback(); }

      function toast(message) {
        clearTimeout(toastTimer);
        byId('toast').textContent = message;
        byId('toast').classList.add('visible');
        toastTimer = setTimeout(() => byId('toast').classList.remove('visible'), 2200);
      }

      byId('play-toggle').addEventListener('click', togglePlayback);
      document.querySelectorAll('[data-speed]').forEach(button => {
        button.addEventListener('click', () => {
          targetSpeed = Number(button.dataset.speed);
          document.querySelectorAll('[data-speed]').forEach(option => option.setAttribute('aria-pressed', String(option === button)));
          toast({ '0.65': '慢一点，海风刚刚好。', '1': '出发，去下一阵风里。', '1.65': '抓稳啦，快乐正在加速！' }[button.dataset.speed]);
        });
      });

      byId('light-toggle').addEventListener('click', () => {
        const dusk = document.body.classList.toggle('dusk');
        byId('light-toggle').setAttribute('aria-pressed', String(dusk));
        byId('light-toggle').setAttribute('aria-label', dusk ? '切换到日间配色' : '切换到日落配色');
        toast(dusk ? '把日落，也装进车筐。' : '今天也是个好天气。');
      });

      // The bell is synthesized locally, and only sounds after an explicit click.
      byId('bell-button').addEventListener('click', async () => {
        toast('叮铃——借过一小阵快乐。');
        clearTimeout(ringTimer);
        nodes['bell-rings'].setAttribute('opacity', '1');
        ringTimer = setTimeout(() => nodes['bell-rings'].setAttribute('opacity', '0'), 850);
        try {
          const Audio = window.AudioContext || window.webkitAudioContext;
          if (!Audio) return;
          audioContext ||= new Audio();
          if (audioContext.state === 'suspended') await audioContext.resume();
          const start = audioContext.currentTime;
          [0, .13].forEach((delay, index) => {
            [1, 2.76, 4.05].forEach((partial, harmonic) => {
              const oscillator = audioContext.createOscillator();
              const envelope = audioContext.createGain();
              const onset = start + delay;
              oscillator.type = 'sine';
              oscillator.frequency.value = (index ? 1780 : 1550) * partial;
              envelope.gain.setValueAtTime(0, onset);
              envelope.gain.linearRampToValueAtTime(.075 / (harmonic + 1), onset + .004);
              envelope.gain.exponentialRampToValueAtTime(.0001, onset + .9);
              oscillator.connect(envelope);
              envelope.connect(audioContext.destination);
              oscillator.start(onset);
              oscillator.stop(onset + 1);
              oscillator.onended = () => { oscillator.disconnect(); envelope.disconnect(); };
            });
          });
        } catch (_) { /* The visual bell also works when audio is unavailable. */ }
      });

      document.addEventListener('keydown', event => {
        if (event.code !== 'Space' || event.repeat || event.altKey || event.ctrlKey || event.metaKey) return;
        if (event.target instanceof Element && event.target.closest('button, input, select, textarea, a, [contenteditable]')) return;
        event.preventDefault();
        togglePlayback();
      });

      document.addEventListener('visibilitychange', () => {
        if (document.hidden) {
          if (frame !== null) cancelAnimationFrame(frame);
          frame = null;
          previousTime = null;
        } else schedule();
      });

      motionPreference.addEventListener('change', event => {
        if (event.matches) { playing = false; updatePlayback(); }
      });

      render();
      updatePlayback();
    })();
  </script>
